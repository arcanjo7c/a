<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Painel – Barbearia Alex</title>
<style>
:root{--bg:#f6f1ea;--card:#fff;--tx:#1d1a17;--mu:#756b60;--ac:#b4731f;--ac2:#fff;--bd:#e3d9cc;--ok:#1f7a4d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15120f;--card:#201c18;--tx:#f3ece3;--mu:#a89c8d;--ac:#d9954a;--ac2:#15120f;--bd:#383128;--ok:#58c58e}}
:root[data-theme="dark"]{--bg:#15120f;--card:#201c18;--tx:#f3ece3;--mu:#a89c8d;--ac:#d9954a;--ac2:#15120f;--bd:#383128;--ok:#58c58e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{text-align:center;padding:36px 16px 20px}
header h1{margin:0;font:700 2rem Georgia,serif;letter-spacing:.04em}
header p{margin:6px 0 0;color:var(--mu)}
main{max-width:560px;margin:0 auto;padding:0 16px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:1rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.grid{display:grid;gap:8px}
.opt{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid var(--bd);border-radius:10px;background:transparent;color:var(--tx);font:inherit;cursor:pointer;text-align:left;width:100%}
.opt.on{border-color:var(--ac);outline:2px solid var(--ac)}
.opt small{color:var(--mu)}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.day{flex:0 0 auto;min-width:64px;text-align:center;padding:8px 6px;border:1px solid var(--bd);border-radius:10px;background:transparent;color:var(--tx);font:inherit;cursor:pointer}
.day.on,.slot.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.day b{display:block;font-size:1.2rem}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.slot{padding:10px 0;border:1px solid var(--bd);border-radius:10px;background:transparent;color:var(--tx);font:inherit;cursor:pointer}
.slot:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:transparent;color:var(--tx);font:inherit;margin-bottom:10px}
.go{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:var(--ac2);font:700 1rem inherit;font-family:inherit;cursor:pointer}
.go:disabled{opacity:.45;cursor:not-allowed}
.msg{color:var(--ok);font-weight:600;margin-top:12px;display:none}
.hint{color:var(--mu);font-size:.85rem;margin:8px 0 0}
.logo{width:120px;height:120px;border-radius:50%;display:block;margin:0 auto 10px;object-fit:cover}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gal img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:10px;display:block}
.end{font-style:normal;line-height:1.6}
.map{display:inline-block;margin-top:10px;padding:10px 16px;border-radius:10px;border:1px solid var(--ac);color:var(--ac);text-decoration:none;font-weight:600}

.bk{border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}
.bk .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bk .h{font-size:1.3rem;font-weight:700}
.bk p{margin:4px 0;color:var(--mu)}.bk p b{color:var(--tx)}
.bk a{color:var(--ac)}
.badge{font-size:.75rem;padding:3px 9px;border-radius:99px;border:1px solid var(--bd)}
.badge.confirmado{color:var(--ok);border-color:var(--ok)}.badge.cancelado{opacity:.6}.badge.concluido{background:var(--ok);color:var(--ac2);border-color:var(--ok)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.acts button{flex:1;min-width:92px;padding:10px;border-radius:10px;border:1px solid var(--bd);background:transparent;color:var(--tx);font:inherit;cursor:pointer}
.acts .ok{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.err{color:#c0392b;margin:8px 0 0}
</style></head><body>
<header><h1>PAINEL DO BARBEIRO</h1><p>Barbearia Alex</p></header>
<main style="max-width:720px">
<section class="card" id="login"><h2>Entrar</h2>
<input id="em" type="email" placeholder="E-mail" autocomplete="username">
<input id="pw" type="password" placeholder="Senha" autocomplete="current-password">
<button class="go" id="go">Entrar</button><p class="err" id="lerr"></p></section>
<div id="app" style="display:none">
<div class="row" id="tabs"></div>
<p class="err" id="err"></p>
<div id="list"></div>
<button class="opt" id="out" style="justify-content:center;margin-top:12px">Sair</button>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var SUPABASE_URL = "COLE_AQUI_A_URL_DO_PROJETO";
var SUPABASE_ANON_KEY = "COLE_AQUI_A_ANON_KEY";
var sb = null; try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch(e) {}
var tab="hoje", rows=[], ch=null, timer=null;
var TABS=[["hoje","Hoje"],["proximos","Próximos dias"],["historico","Histórico"]];
var ST={pendente:"Pendente",confirmado:"Confirmado",concluido:"Concluído",cancelado:"Cancelado"};
function $(i){return document.getElementById(i)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function br(k){var p=k.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function brl(n){return "R$ "+Number(n).toFixed(2).replace(".",",")}
async function load(){
  if(!sb) return;
  var r=await sb.from("agendamentos").select("*").order("data",{ascending:true}).order("hora",{ascending:true});
  if(r.error){$("err").textContent="Erro ao carregar: "+r.error.message;return}
  $("err").textContent=""; rows=r.data||[]; draw();
}
function draw(){
  var t=$("tabs"); t.innerHTML="";
  TABS.forEach(function(x){var b=el("button","day"+(tab===x[0]?" on":""),x[1]);b.onclick=function(){tab=x[0];draw()};t.appendChild(b)});
  var today=key(new Date()), list=rows.filter(function(a){
    return tab==="hoje"?a.data===today:tab==="proximos"?a.data>today:a.data<today;
  });
  if(tab==="historico") list.reverse();
  var box=$("list"); box.innerHTML="";
  if(!list.length){box.appendChild(el("p","hint","Nenhum agendamento aqui."));return}
  list.forEach(function(a){
    var c=el("div","bk"), top=el("div","top");
    top.appendChild(el("span","h",a.hora+" · "+br(a.data)));
    top.appendChild(el("span","badge "+a.status,ST[a.status]||a.status));
    c.appendChild(top);
    var p1=el("p"); p1.appendChild(el("b",null,a.nome)); c.appendChild(p1);
    var p2=el("p"), tel=el("a",null,a.telefone); tel.href="tel:"+a.telefone.replace(/\D/g,""); p2.appendChild(tel); c.appendChild(p2);
    c.appendChild(el("p",null,a.servico+" · "+brl(a.preco)));
    var acts=el("div","acts");
    function btn(txt,s,cls){var b=el("button",cls||"",txt);b.onclick=function(){setStatus(a.id,s)};acts.appendChild(b)}
    if(a.status==="pendente") btn("Confirmar","confirmado","ok");
    if(a.status==="pendente"||a.status==="confirmado") btn("Concluir","concluido");
    if(a.status==="pendente"||a.status==="confirmado") btn("Cancelar","cancelado");
    if(acts.children.length) c.appendChild(acts);
    box.appendChild(c);
  });
}
async function setStatus(id,s){
  if(s==="cancelado"&&!confirm("Cancelar este agendamento? O horário volta a ficar livre.")) return;
  var r=await sb.from("agendamentos").update({status:s}).eq("id",id);
  if(r.error) alert("Erro: "+r.error.message);
  load();
}
function start(){
  $("login").style.display="none"; $("app").style.display="block"; load();
  ch=sb.channel("ag").on("postgres_changes",{event:"*",schema:"public",table:"agendamentos"},load).subscribe();
  timer=setInterval(load,30000);
}
$("go").onclick=async function(){
  if(!sb){$("lerr").textContent="Painel ainda não configurado.";return}
  var r=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  if(r.error){$("lerr").textContent="E-mail ou senha incorretos.";return}
  $("pw").value=""; $("lerr").textContent=""; start();
};
$("out").onclick=async function(){
  await sb.auth.signOut(); clearInterval(timer); if(ch) sb.removeChannel(ch);
  rows=[]; $("app").style.display="none"; $("login").style.display="block";
};
if(sb) sb.auth.getSession().then(function(r){ if(r.data.session) start(); });
</script></body></html>
